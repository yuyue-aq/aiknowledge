[project]
name = "aiknowledge"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "charset-normalizer>=3.4.0",
    "celery>=5.6.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "markdown-it-py>=4.0.0",
    "minio>=7.2.18",
    "pydantic-settings>=2.11.0",
    "pgvector>=0.4.2",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "redis>=7.1.0",
    "SQLAlchemy>=2.0.46",
]

[project.optional-dependencies]
# The production BGE adapter imports FlagEmbedding lazily. Keeping it optional
# lets the complete test suite run without downloading a multi-gigabyte local
# model or requiring a GPU.
local-embeddings = [
    "FlagEmbedding>=1.3.5",
    "torch>=2.14.0",
]

[tool.uv.sources]
torch = [
    # The MVP runs BGE on CPU by default. Using the official CPU index keeps
    # container builds small and avoids pulling several gigabytes of CUDA
    # runtime packages when no GPU is configured.
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
