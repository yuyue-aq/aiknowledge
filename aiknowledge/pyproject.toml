[project]
name = "aiknowledge"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.11.0",
]

[project.optional-dependencies]
# The production BGE adapter imports FlagEmbedding lazily. Keeping it optional
# lets the complete test suite run without downloading a multi-gigabyte local
# model or requiring a GPU.
local-embeddings = [
    "FlagEmbedding>=1.3.5",
    "torch>=2.14.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
