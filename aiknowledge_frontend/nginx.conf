server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A batch accepts at most 20 files of 20 MiB, plus multipart overhead.
  client_max_body_size 420m;

  location /api/ {
    add_header Cache-Control "no-store" always;
    # Docker DNS must be refreshed when the API container is recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_backend http://api:8000;
    proxy_pass $api_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Preserve SSE events and allow cold local embedding initialization.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
