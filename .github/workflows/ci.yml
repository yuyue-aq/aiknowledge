name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiknowledge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python -m compileall -q app tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiknowledge_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit --skipLibCheck
      - run: npm test
      - run: npx eslint src
      - run: npm run lint:style
      - run: npm run build:h5

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare model placeholder for Compose build
        shell: bash
        run: mkdir -p models/embedding/bge-large-zh-v1.5
      - name: Build runtime images
        run: docker compose --env-file aiknowledge/.env.example build api worker frontend
