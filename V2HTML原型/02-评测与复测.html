case 'scope-change':return head('问答范围已变化','本次结果已停止返回。')+`<section class="status-scene panel">${notice('<strong>公开分类在回答期间被关闭</strong><br>旧范围的结果不再返回。请确认新范围后重新提问。','warning')}<div class="step-list"><div class="step-item">${icon('check')}问题已接收</div><div class="step-item">${icon('check')}已检索原开放资料</div><div class="step-item">${icon('lock')}输出前检测到分类范围变化</div></div>${btn('查看当前开放范围','go-categories','outline')}</section>`;
case 'delete':return head('删除确认','执行前说明对象与后果。')+`<section class="modal-mock"><span class="space-icon">${icon('trash')}</span><h2>删除项目技术说明.pdf？</h2><p>删除后，这份资料不再参与新的检索与问答。历史引用和评测记录的清理范围，以最终确认的数据政策为准。</p><div class="row">${btn('取消','go-docs','outline')}${btn('删除资料','delete','danger')}</div></section>`;
case 'pending':return head('资料状态与历史依据','处理中与已删除来源需要清楚区分。')+`<section class="panel"><div class="scope-row"><div><strong>项目复盘.docx</strong><small>正在解析，尚未参与问答</small></div>${pill('处理中','warning')}</div><div class="progress" style="margin:18px 0"><span style="width:48%"></span></div>${notice('资料处理完成前，问答仍只使用已有可用资料。')}<hr class="divider"><h3>历史回答的来源</h3><article class="evidence"><strong>引用 [1] · 来源已删除</strong><p class="muted">此处仅标记历史依据不可用，不重新将资料加入当前检索。</p>${pill('不可用于新回答','neutral')}</article>${btn('返回资料管理','go-docs','outline')}</section>`;
case 'chunk':return head('结构分块预览','P1 · 比较分块是否保留完整证据。',pill('规划中','warning'))+`<div class="compare-grid"><section class="panel"><h3>现有长度分块</h3><div class="mono-block">片段 1：项目背景…访客访问规则…\n──────────────\n片段 2：分类关闭后…输出复核…</div><p class="muted" style="margin-top:18px">相关说明可能位于相邻片段。</p></section><section class="panel"><h3>按标题与段落分块</h3><div class="mono-block">标题：公开访问控制\n允许分类 → 当前开放状态\n撤销与关闭 → 输出前复核</div><p class="muted" style="margin-top:18px">保留结构仍需验证模型输入长度。</p></section></div><div style="margin-top:22px">${notice('概念稿，不表示结构分块已经接入。')}${btn('模拟比较','compare-demo','outline','style="margin-top:16px"')}</div>`;
case 'hybrid':return head('混合检索对比','P1 · 语义与精确关键词互补。',pill('规划中','warning'))+`<div class="panel"><h3>问题：SCOPE_CHANGED 如何处理？</h3><p class="muted">同一题集与资料版本的演示结果。</p></div><div class="three" style="margin-top:20px">${[['向量检索','相关语义说明','第 3 名'],['关键词检索','精确错误码','第 1 名'],['RRF 融合','范围变化处理','第 1 名']].map(a=>`<section class="panel"><h3>${a[0]}</h3>${pill(a[2])}<p style="margin-top:20px">${a[1]}</p><hr class="divider"><small>按片段去重，保留各路排名。</small></section>`).join('')}</div>`;
case 'rerank':return head('重排前后对比','P1 · 只改善已召回候选的顺序。',pill('规划中','warning'))+`<div class="compare-grid"><section class="panel"><h3>重排前</h3><div class="scope-row">1 · 项目介绍</div><div class="scope-row">2 · 团队流程</div><div class="scope-row">3 · 公开范围规则</div></section><section class="panel"><h3>重排后 · 演示</h3><div class="scope-row">1 · 公开范围规则 ${pill('相关','success')}</div><div class="scope-row">2 · 项目介绍</div><div class="scope-row">3 · 团队流程</div></section></div><div style="margin-top:22px">${notice('正确证据未被召回时，重排无法补回；需同时评估新增耗时。')}</div>`;
case 'rewrite':return head('查询改写对比','P2 · 补全指代，保留原问题。',pill('规划中','warning'))+`<section class="panel"><label>上一轮用户问题</label><div class="mono-block">这个项目如何限制访客访问？</div><label>当前追问</label><div class="mono-block">那关闭之后呢？</div><label>改写候选 · 演示</label><div class="mono-block">公开分类关闭后，访客还能检索这些资料吗？</div><div style="margin-top:20px">${notice('改写不得丢失编号、时间或否定条件，失败时使用原问题。')}${btn('模拟检索对比','compare-demo','outline','style="margin-top:18px"')}</div></section>`;
case 'publish':return head('公开回答稿审核','P2 · 在发布前确认可公开内容。',pill('规划中','warning'))+`<div class="two"><section class="panel"><h3>公开稿草案</h3><p>我的主要工作包括文档处理、范围控制、检索诊断和评测回归。</p><hr class="divider"><p>项目使用合成资料展示完整业务流程，不包含客户信息和内部预算。</p><label for="publish-note">审核备注</label><textarea id="publish-note" placeholder="检查是否包含不可公开的信息"></textarea></section><aside class="panel"><h3>发布检查</h3>${['职责描述适合公开','不含客户与个人联系方式','成果指标已核验'].map(x=>`<label class="row"><input type="checkbox">${x}</label>`).join('')}${notice('该方案尚未纳入 MVP；确认后才建立独立发布稿链路。','warning')}<div style="margin-top:20px">${btn('模拟审核通过','publish-demo')}</div></aside></div>`;
case 'feedback-case':return head('反馈转回归题','P2 · 真实失败进入持续验证。',pill('规划中','warning'))+`<div class="two"><section class="panel"><h3>原始反馈</h3>${pill('来源不匹配','warning')}<p style="margin-top:18px">文档更新后，答案引用仍然指向旧版本。</p><hr class="divider"><p class="muted">由拥有者确认标准答案和证据，不直接采用 AI 自评。</p></section><section class="panel"><label for="regression-question">回归问题</label><textarea id="regression-question">更新文档后，问答应该使用哪个版本？</textarea><label for="regression-answer">标准答案</label><textarea id="regression-answer">新版本处理成功并激活后，使用新版本；处理失败时保留可用旧版本。</textarea>${btn('模拟保存到待审核题集','save','',`style="margin-top:18px"`)}</section></div>`;
default:return head(s.title,s.desc)+notice('此页面为本地原型。');}}
function renderScene(s){const body=sceneBody(s);return s.type.startsWith('public-')?publicShell(body):shell(s,body)}
let activeScene=null;let device='desktop';let lastTrigger=null;let pendingTimers=[];let savedGrade=null;
const dialog=$('#preview');
function stopTimers(){pendingTimers.forEach(clearTimeout);pendingTimers=[]}
function renderActive(){stopTimers();savedGrade=null;$('#preview-title').textContent=activeScene.title;$('#preview-content').innerHTML=`<div class="device-surface ${device==='phone'?'phone':''}">${renderScene(activeScene)}</div>`;document.title=activeScene.title+' · 知溯 V2 原型'}
function openScene(s,trigger){activeScene=s;lastTrigger=trigger||document.activeElement;renderActive();if(!dialog.open)dialog.showModal();$('#close-preview').focus()}
function closeScene(){stopTimers();dialog.close();document.title=GROUP.title+' · 知溯 V2 原型';lastTrigger?.focus()}
function go(type){const s=ALL_SCENES.find(x=>x.type===type);if(s){activeScene=s;renderActive()}else toast('请从对应分组画册打开此页面')}
function toast(text){const t=$('#toast');(dialog.open?dialog:document.body).append(t);t.textContent=text;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3500)}
function confirmAction(title,text,onConfirm){const c=$('#confirm');$('#confirm-title').textContent=title;$('#confirm-text').textContent=text;const origin=document.activeElement;$('#confirm-yes').onclick=()=>{c.close();origin?.focus();onConfirm()};$('#confirm-no').onclick=()=>{c.close();origin?.focus()};c.oncancel=()=>setTimeout(()=>origin?.focus(),0);c.showModal();$('#confirm-no').focus()}
function timer(fn,ms){pendingTimers.push(setTimeout(fn,ms))}
function simulate(button,label,done){button.disabled=true;button.setAttribute('aria-busy','true');const old=button.innerHTML;button.textContent=label;timer(()=>{if(!button.isConnected)return;button.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=old;done()},700)}
const gotoMap={'go-detail':'detail','go-docs':'docs','go-chat':'chat','go-retrieval':'retrieval','go-edit':'edit','go-cases':'cases','go-select':'select','go-run':'run','go-grade':'grade','go-compare':'compare','go-categories':'categories','go-share':'share','go-public':'public-start','go-feedback':'feedback-form','go-repair':'repair'};
function handlePrototypeClick(e){e.stopPropagation();
 const opener=e.target.closest('[data-open]');if(opener){openScene(GROUP.scenes[Number(opener.dataset.open)],opener);return}
 const dev=e.target.closest('[data-device]');if(dev){device=dev.dataset.device;document.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x===dev)));renderActive();return}
 if(e.target.closest('#close-preview')){closeScene();return}
 const suggestion=e.target.closest('[data-suggestion]');if(suggestion){const input=$('.composer input',dialog);input.value=suggestion.dataset.suggestion;input.focus();return}
 const nav=e.target.closest('[data-nav]');if(nav){go({'空间':'spaces','问答':'chat','资料':'docs','反馈':'feedback-list','评测':'cases'}[nav.dataset.nav]);return}
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(gotoMap[a]){go(gotoMap[a]);return}
 if(a==='clear-search'){const input=$('input',b.parentElement);input.value='';input.dispatchEvent(new Event('input',{bubbles:true}));input.focus();return}
 if(a==='grade'){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));savedGrade=b.dataset.value;return}
 if(a==='save-grade'){if(!savedGrade){const err=$('[data-validation]',dialog);err.textContent='请选择一个评分结果，再保存。';err.classList.remove('hidden');$('.grading button',dialog).focus();return}simulate(b,'保存中…',()=>toast('已保存演示评分：'+savedGrade));return}
 if(a==='choose-feedback'){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}
 if(a==='delete'||a==='revoke'){confirmAction(a==='delete'?'删除这份演示资料？':'撤销演示分享链接？',a==='delete'?'删除后不再参与新的问答。原型只模拟操作，不删除真实资料。':'撤销后访客不能继续访问。原型不会修改真实分享链接。',()=>{toast(a==='delete'?'已模拟删除，当前列表已更新':'已模拟撤销分享链接');if(a==='delete'){go('docs');$('tbody tr',dialog)?.remove();$('.counts span',dialog).textContent='显示 2 份演示资料';$('.toolbar .pill',dialog).textContent='全部资料 · 2'}else go('public-expired')});return}
 if(a==='save-scope'){confirmAction('保存公开范围？','只有已勾选的分类可被访客检索；关闭分类会影响后续问答。此处为本地模拟。',()=>toast('已保存演示分类范围'));return}
 if(a==='copy'){const input=$('#share-url',dialog);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(input.value).then(()=>toast('已复制演示占位地址')).catch(()=>{input.select();toast('请使用键盘复制已选中的演示地址')})}else{input.select();toast('请使用键盘复制已选中的演示地址')}return}
 if(a==='upload'||a==='retry-upload'){simulate(b,'模拟处理中…',()=>{toast('演示资料已就绪');if(a==='retry-upload')go('docs');else{const row=document.createElement('tr');row.innerHTML='<td>补充项目说明.txt<small>合成资料 · 本地模拟</small></td><td>'+pill('可用','success')+'</td><td>刚刚</td><td>'+btn('查看','go-detail','ghost small')+'</td>';$('tbody',dialog)?.append(row)}});return}
 if(a==='retry-model'){simulate(b,'正在模拟重试…',()=>{$('[data-chat]',dialog).innerHTML=answerBox();toast('模拟回答已完成')});return}
 if(a==='update-doc'){simulate(b,'模拟处理中…',()=>toast('演示新版本已激活，可以复测'));return}
 if(a==='run-eval'){simulate(b,'正在模拟运行…',()=>{$('[data-progress-label]',dialog).textContent='已完成 20 / 20 题';$('[data-progress-bar]',dialog).style.width='100%';toast('演示运行结束：仍需人工评分')});return}
 if(a==='empty-space'||a==='empty-results'){$('[data-empty]',dialog).innerHTML=a==='empty-space'?`<h2>还没有可用资料</h2><p>上传一份资料后再提问。</p>${btn('去上传','go-docs')}`:`<h2>没有找到相关片段</h2><p>尝试更具体的问题，或补充当前范围内的资料。</p>${btn('重新检索','go-retrieval')}`;return}
 if(a==='cite'){go('evidence');return}
 if(a==='create-space'){confirmAction('创建演示知识空间？','将打开本地资料管理原型，不创建真实空间。',()=>go('docs'));return}
 if(a==='publish-demo'){confirmAction('确认演示公开稿？','该页面是 P2 概念稿，不会发布任何内容。',()=>toast('已模拟审核通过，尚未发布'));return}
 if(a.startsWith('submit-'))return;
 if(a==='save-evidence'){toast('已保存演示证据选择');go('edit');return}
 toast(a==='feedback-good'?'已记录演示反馈：有用':a==='compare-demo'?'当前显示的是合成对比结果':'已完成本地模拟操作');
}
document.addEventListener('click',handlePrototypeClick);
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const type=form.dataset.form;const input=form.querySelector('[name=question]');const err=$('[data-validation]',form)||$('[data-validation]',form.parentElement);if(input&&!input.value.trim()){if(err){err.textContent='请先输入问题。';err.classList.remove('hidden');}input.setAttribute('aria-invalid','true');input.focus();return}if(input)input.removeAttribute('aria-invalid');if(err)err.classList.add('hidden');const b=form.querySelector('[type=submit]')||form.querySelector('[data-action^=submit]');if(type==='retrieval'){simulate(b,'检索中…',()=>{$('[data-results]',dialog).innerHTML=`<div class="row between" style="margin-bottom:14px"><strong>模拟检索完成 · ${esc(form.elements.namedItem('topk').value)} 条</strong><small>仅使用合成资料</small></div><div class="two"><section>${Array.from({length:Number(form.elements.namedItem('topk').value)},(_,i)=>evidence(i===0,i+1)).join('')}</section><aside class="panel"><h3>当前问题</h3><p>${esc(input.value)}</p><hr class="divider">${notice('固定合成片段用于交互预览，并未计算真实向量。')}${btn('去问答','go-chat','outline','style="margin-top:20px"')}</aside></div>`});return}if(type==='chat'||type==='public-chat'){const q=input.value;simulate(b,'生成中…',()=>{const target=$('[data-chat]',dialog);const block=document.createElement('div');block.innerHTML=`<div class="chat-question"><span>${esc(q)}</span></div><article class="answer-box">${pill('本地演示回答','success')}<p>${answer}</p><small>固定合成回答，不代表真实模型对该问题的结果。</small></article>`;target.append(block);input.value='';input.focus()});return}simulate(b,'保存中…',()=>{toast('已保存本地演示内容');go(type==='feedback'?'feedback-list':'cases')})});
document.addEventListener('change',e=>{if(e.target.matches('[data-scope-toggle]'))e.target.nextElementSibling.textContent=e.target.checked?'开放':'关闭'});
document.addEventListener('input',e=>{if(e.target.matches('.searchbox input')){const q=e.target.value.trim();const table=e.target.closest('.content')?.querySelector('tbody');if(table)Array.from(table.rows).forEach(row=>row.hidden=!row.textContent.includes(q));}});
dialog.addEventListener('cancel',()=>{stopTimers();document.title=GROUP.title+' · 知溯 V2 原型';setTimeout(()=>lastTrigger?.focus(),0)});
function init(){const nav=$('#review-nav');nav.innerHTML=GROUPS.map((g,i)=>`<a href="${encodeURI(g.file)}" class="${i===GROUP.index?'active':''}" ${i===GROUP.index?'aria-current="page"':''}>${String(i+1).padStart(2,'0')} ${g.title}</a>`).join('');$('#gallery').innerHTML=GROUP.scenes.map((s,i)=>`<article class="screen-card"><div class="mini" aria-hidden="true" inert><div class="mini-stage"><div class="device-surface">${renderScene(s).replace(/\s(?:id|for)="[^"]*"/g,'')}</div></div></div><div class="card-caption"><div><div class="card-id">${GROUP.index===4?'扩展概念':'MVP'} / ${String(i+1).padStart(2,'0')}</div><h2>${s.title}</h2><small>${s.desc}</small></div>${btn('查看','open','outline small',`data-open="${i}"`)}</div></article>`).join('');const ro=new ResizeObserver(entries=>entries.forEach(({target})=>{const scale=target.clientWidth/1160;$('.mini-stage',target).style.transform=`scale(${scale})`;target.style.height=780*scale+'px'}));document.querySelectorAll('.mini').forEach(x=>ro.observe(x));}
init();
</script></body></html>
